name: testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask requests pytest pytest-cov flake8

      - name: run linting
        run: |
          flake8 src/ tests/ --max-line-length=100

      - name: run tests and check coverage
        timeout-minutes: 5
        run: |
          pytest tests/ -v --cov=src --cov-branch --cov-report=term-missing --cov-fail-under=75

      - name: run regression tests
        run: |
          pytest tests/test_regression.py -v
